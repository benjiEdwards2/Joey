# Joey hub + connectors test suite (JY-006): the full pytest suite on every ready (non-draft) PR.
# Mirrors the life-test gate image (deploy/test.Dockerfile): Python 3.12, the same three requirement files, git on
# PATH. Differences from the gate: -n auto instead of -n 2 (the NAS RAM limit does not apply here), the runner has
# network and node (the node-only tests that skip in the gate run here). No code path filter: tests/tv and tests/deploy
# read tv/ files, so tv-only PRs run the suite too (tv.yml still builds the Android shell).
# GitHub budget (2026-10-29, G1-G3 of review-joeyv2-evaluation-2026-10-29.md): no run on push to main (the squash
# commit is the PR head that already passed), docs-only changes skip the suite, and draft PRs do not run it. Mark the
# PR ready after review to run CI; workflow_dispatch re-runs it by hand.
# Third-party actions are pinned by full commit SHA.
name: ci

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "HITLIST.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            hub/requirements.txt
            connectors/requirements.txt
            requirements-dev.txt

      - name: Install the gate image's requirements
        run: python -m pip install -r hub/requirements.txt -r connectors/requirements.txt -r requirements-dev.txt

      - name: pytest (full suite)
        run: python -m pytest -q -n auto tests/
