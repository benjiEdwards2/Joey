# =============================================================================
# areas.yaml — THE dashboard. Rooms are config, not code (DECISIONS 2026-08-17).
# 7 areas in the list incl. hidden (Money removed 2026-10-27, JY-220); hard cap of 9 is enforced by hub/registry.py.
# icon: id of an embedded SVG line icon (gate decision 2026-08-28 replaced emoji).
# tier: link  = button that opens the real app (href required)
#       embed = hourly cached snippet (snapshot + stale_after_minutes required)
#       ingest= data in our own store    (snapshot + stale_after_minutes required)
# snapshot ids come from the FROZEN D13 namespace:
#   open_meteo gcal clickup macromates home_assistant jellyfin nas_stats money
#   media_status arr jellyseerr qbittorrent system wud uptime_kuma
# detail: optional hub route (starts with /) — the whole embed card links to it.
# tone: optional colour token name (orange sky teal fuchsia gold) for the area's icon chip on its summary tile (JY-233);
#   none = the neutral chip.
# `hidden: true` parks an area: no rail, tab or hub card; its page still serves.
# `layout: server` renders /a/<id> as the /server bands page (2026-10-06).
# Tiles for sources not yet built still render — as "Not connected" (by design).
# gated_hrefs: app / tile id -> its Cloudflare-gated hostname (2026-10-09). Server service cards and link
#   tiles use it instead of the LAN address in the snapshot; any other LAN-only app renders as a plain card
#   saying "LAN" (a LAN link is dead off the home network). Public hostnames live here, never in .py files.
# =============================================================================

gated_hrefs: {}                                       # homepage removed 2026-10-09 (decision 9: Homepage retired)

areas:
  # Rail / tab order = the order of this list; `rail_section: home` lifts an area into the Home group.
  - id: kitchen
    hidden: true                                     # (parked by B., 2026-10-06 — not connected yet)
    name: Food                                       # renamed from Kitchen (B., 2026-09-11); id stays 'kitchen'
    icon: kitchen
    summary_tile: meals
    tiles:
      - id: meals
        label: Meal plan
        tier: embed
        owner: shared
        snapshot: macromates
        stale_after_minutes: 120
        setup_note: "MacroMates read-only connector arrives at WP27."
      - id: macromates-app
        label: Open MacroMates
        tier: link
        owner: shared
        href: "https://macromates.joeyhome.net"      # self-hosted behind the same Access gate (2026-10-05)

  - id: desk
    hidden: true                                     # (parked by B., 2026-10-06 — not connected yet)
    name: Desk
    icon: desk
    summary_tile: files
    tiles:
      - id: files
        label: NAS files
        tier: embed
        owner: you
        snapshot: nas_stats
        stale_after_minutes: 120
        setup_note: "NAS stats connector arrives at WP30."
      - id: notion
        label: Notion
        tier: link
        owner: shared
        href: "https://www.notion.so"               # Q12 answered at WP21 sign-off (2026-09-11)

  - id: calendar
    name: Calendar
    icon: calendar
    tone: sky                                       # icon chip colour on the hub card (JY-233, B. 2026-10-24)
    summary_tile: next-event
    tiles:
      - id: next-event
        label: Next up
        tier: embed
        owner: shared
        snapshot: gcal
        stale_after_minutes: 120
        show_media_releases: true                    # E5 (H2, 2026-10-13): arr releases join Next 7 days as "Media" rows
        setup_note: "Calendar ICS connector (Google + Outlook) arrives at WP25."
      - id: weather
        label: Weather
        tier: embed
        owner: shared
        snapshot: open_meteo
        stale_after_minutes: 180
        setup_note: "Open-Meteo connector arrives at WP24."   # config anchor for find_weather: renders on the hub + /weather only, never on area pages (2026-10-08)
      - id: gcal-app
        label: Google Calendar
        tier: link
        owner: shared
        href: "https://calendar.google.com"          # link-out beside the upcoming list (B., 2026-09-11)

  - id: media
    name: Media
    icon: media
    tone: orange                                       # icon chip colour on the hub card (JY-233, B. 2026-10-24)
    summary_tile: watching
    rail_section: home                               # rail: Home group, between Hub and Weather (B., 2026-10-06)
    hub_rank: 1                                      # first hub card (2026-10-05)
    layout: shelves                                  # hero + poster shelves instead of tile cards (2026-10-05)
    tiles:
      - id: watching
        label: Now playing
        tier: embed
        owner: shared
        snapshot: jellyfin
        detail: /media/playing                       # whole card opens the Now playing page
        stale_after_minutes: 10                      # 2-minute fast sweep since 2026-10-05
        setup_note: "Jellyfin connector arrives at WP29."
      - id: status
        label: Media apps
        tier: embed
        owner: shared
        snapshot: media_status
        detail: /media/apps
        stale_after_minutes: 10
        setup_note: "Set MEDIA_STATUS_HOST in deploy/.env."
      - id: arrivals
        label: Library
        tier: embed
        owner: shared
        snapshot: arr
        detail: /media/library
        stale_after_minutes: 180
        setup_note: "Set RADARR_URL/RADARR_API_KEY/SONARR_URL/SONARR_API_KEY in deploy/.env."
      - id: downloads
        label: Downloads
        tier: embed
        owner: shared
        snapshot: qbittorrent
        detail: /media/downloads
        stale_after_minutes: 10
        setup_note: "Set QBIT_URL/QBIT_USER/QBIT_PASS in deploy/.env."
      - id: requests
        label: Requests
        tier: embed
        owner: shared
        snapshot: jellyseerr
        detail: /media/requests
        stale_after_minutes: 180
        setup_note: "Set JELLYSEERR_URL/JELLYSEERR_API_KEY in deploy/.env."
      # 2026-10-05: Discover & Search (search + shelves + Request) - live Jellyseerr call path.
      - id: discover
        label: Discover
        tier: embed
        owner: shared
        snapshot: jellyseerr
        detail: /media/discover
        stale_after_minutes: 180
        setup_note: "Set JELLYSEERR_URL/JELLYSEERR_API_KEY in deploy/.env."
      - id: history
        label: Watched
        tier: embed
        owner: shared                                # was you; her Jellyfin user has history/diary too (2026-10-05)
        snapshot: jellyfin
        detail: /media/history
        stale_after_minutes: 10
        setup_note: "Set JELLYFIN_URL/JELLYFIN_API_KEY in deploy/.env."
      - id: diary
        label: Diary
        tier: embed
        owner: shared                                # was you; her Jellyfin user has history/diary too (2026-10-05)
        snapshot: jellyfin
        detail: /media/diary                         # watch diary: Jellyfin history + hand-logged watches (2026-10-05)
        stale_after_minutes: 10
        setup_note: "Set JELLYFIN_URL/JELLYFIN_API_KEY in deploy/.env."
      - id: jellyfin-app
        label: Open Jellyfin
        tier: link
        owner: shared
        href: "http://192.168.68.59:8096"            # Jellyfin on the NAS, LAN-only (WP6 adopt-in-place, 2026-09-11)

  - id: house
    hidden: true                                     # (parked by B., 2026-10-06 — not connected yet)
    name: House
    icon: house
    summary_tile: climate
    tiles:
      - id: climate
        label: Inside
        tier: embed
        owner: shared
        snapshot: home_assistant
        stale_after_minutes: 120
        setup_note: "Home Assistant connector arrives at WP28."

  - id: car
    hidden: true                                     # (parked by B., 2026-10-06 — not connected yet)
    name: Car
    icon: car
    summary_tile: car-status
    tiles:
      - id: car-status
        label: Car
        tier: embed
        owner: you
        snapshot: home_assistant
        stale_after_minutes: 240
        setup_note: "Renders 'Not connected' until HA has car entities (Q16 — never fabricated)."

  # Server (B. approved scope 2026-10-06): replaces the NAS "Homepage" dashboard natively (Homepage retired 2026-10-09).
  # Thresholds: disk 85 %, media.db backup 36 h, any service Down = attention.
  - id: server
    name: Server
    icon: server
    tone: teal                                       # icon chip colour on the hub card (JY-233, B. 2026-10-24)
    summary_tile: services
    layout: server                                   # /a/server renders the /server bands page
    tiles:
      - id: services
        label: Services
        tier: embed
        owner: shared
        snapshot: media_status
        detail: "/server#services"
        stale_after_minutes: 10
        setup_note: "Set MEDIA_STATUS_HOST in deploy/.env."
      - id: system
        label: System
        tier: embed
        owner: shared
        snapshot: system
        detail: /server
        stale_after_minutes: 10
        setup_note: "Reads /proc inside the connectors container; no env needed (WP-S2)."
      - id: monitors
        label: Monitors
        tier: embed
        owner: shared
        snapshot: uptime_kuma
        detail: "/server#services"   # 2026-10-12: the Monitors band was removed (it repeated Services)
        stale_after_minutes: 10
        setup_note: "Set UPTIME_KUMA_URL/UPTIME_KUMA_API_KEY in deploy/.env."
      - id: updates
        label: Updates
        tier: embed
        owner: shared
        snapshot: wud
        detail: "/server#updates"
        stale_after_minutes: 180
        setup_note: "Set WUD_URL/WUD_USER/WUD_PASS in deploy/.env."
      - id: portainer
        label: Portainer
        tier: link
        owner: shared
        href: "http://192.168.68.59:9000"
