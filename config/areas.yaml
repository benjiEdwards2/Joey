# =============================================================================
# areas.yaml — THE dashboard. Rooms are config, not code (DECISIONS 2026-08-17).
# 8 areas locked (2026-08-24); hard cap of 9 is enforced by hub/registry.py.
# Accent hexes approved at the WP0 mockup gate (2026-08-28).
# icon: id of an embedded SVG line icon (gate decision 2026-08-28 replaced emoji).
# tier: link  = button that opens the real app (href required)
#       embed = hourly cached snippet (snapshot + stale_after_minutes required)
#       ingest= data in our own store    (snapshot + stale_after_minutes required)
# snapshot ids come from the FROZEN D13 namespace:
#   open_meteo gcal clickup macromates home_assistant jellyfin nas_stats money
#   media_status arr jellyseerr qbittorrent
# detail: optional hub route (starts with /) — the whole embed card links to it.
# `hidden: true` parks an area: no rail, tab or hub card; its page still serves.
# Tiles for sources not yet built still render — as "Not connected" (by design).
# =============================================================================

areas:
  # Rail / tab order = the order of this list; `rail_section: home` lifts an area into the Home group.
  - id: kitchen
    hidden: true                                     # (parked by B., 2026-10-06 — not connected yet)
    name: Food                                       # renamed from Kitchen (B., 2026-09-11); id stays 'kitchen'
    accent: "#5BE08C"
    icon: kitchen
    summary_tile: meals
    tiles:
      - id: meals
        label: Meal plan
        tier: embed
        owner: shared
        snapshot: macromates
        stale_after_minutes: 120
        setup_note: "MacroMates read-only connector arrives at WP27."
      - id: macromates-app
        label: Open MacroMates
        tier: link
        owner: shared
        href: "https://macromates.joeyhome.net"      # self-hosted behind the same Access gate (2026-10-05)

  - id: money
    hidden: true                                     # (parked by B., 2026-10-06 — not connected yet)
    name: Money
    accent: "#3FD9C0"
    icon: money
    hub_size: s22        # second bento hero beside Media (B., 2026-10-06; was s21 for a day)
    summary_tile: month
    tiles:
      - id: month
        label: This month
        tier: ingest
        owner: shared
        snapshot: money
        stale_after_minutes: 11520   # 8 days — weekly CSV cadence + grace (D14)
        setup_note: "Money importer arrives in Track E (WP31+)."

  - id: desk
    hidden: true                                     # (parked by B., 2026-10-06 — not connected yet)
    name: Desk
    accent: "#5B9CF6"
    icon: desk
    summary_tile: files
    tiles:
      - id: files
        label: NAS files
        tier: embed
        owner: you
        snapshot: nas_stats
        stale_after_minutes: 120
        setup_note: "NAS stats connector arrives at WP30."
      - id: notion
        label: Notion
        tier: link
        owner: shared
        href: "https://www.notion.so"               # Q12 answered at WP21 sign-off (2026-09-11)
      - id: nas-home
        label: NAS Homepage
        tier: link
        owner: shared
        href: "http://192.168.68.59:3000"           # Asustor Homepage app (2026-08-28)

  - id: calendar
    name: Calendar
    accent: "#A78BFA"
    icon: calendar
    hub_size: s21        # double-width (gate 2026-08-28)
    summary_tile: next-event
    tiles:
      - id: next-event
        label: Next up
        tier: embed
        owner: shared
        snapshot: gcal
        stale_after_minutes: 120
        setup_note: "Calendar ICS connector (Google + Outlook) arrives at WP25."
      - id: weather
        label: Weather
        tier: embed
        owner: shared
        snapshot: open_meteo
        stale_after_minutes: 180
        setup_note: "Open-Meteo connector arrives at WP24."   # D18: lives here, never on the hub
      - id: gcal-app
        label: Google Calendar
        tier: link
        owner: shared
        href: "https://calendar.google.com"          # link-out beside the upcoming list (B., 2026-09-11)

  - id: media
    name: Media
    accent: "#E50914"          # Netflix red — Media Layout Lab pick, 2026-10-05 (was #FF5CA8)
    icon: media
    summary_tile: watching
    rail_section: home                               # rail: Home group, between Hub and Weather (B., 2026-10-06)
    hub_rank: 1                                      # first hub card (2026-10-05)
    hub_size: s22                                    # largest hub card, hero (2026-10-05)
    layout: shelves                                  # hero + poster shelves instead of tile cards (2026-10-05)
    tiles:
      - id: watching
        label: Now playing
        tier: embed
        owner: shared
        snapshot: jellyfin
        detail: /media/playing                       # whole card opens the Now playing page
        stale_after_minutes: 10                      # 2-minute fast sweep since 2026-10-05
        setup_note: "Jellyfin connector arrives at WP29."
      - id: status
        label: Media apps
        tier: embed
        owner: shared
        snapshot: media_status
        detail: /media/apps
        stale_after_minutes: 10
        setup_note: "Set MEDIA_STATUS_HOST in deploy/.env."
      - id: arrivals
        label: Library
        tier: embed
        owner: shared
        snapshot: arr
        detail: /media/library
        stale_after_minutes: 180
        setup_note: "Set RADARR_URL/RADARR_API_KEY/SONARR_URL/SONARR_API_KEY in deploy/.env."
      - id: downloads
        label: Downloads
        tier: embed
        owner: shared
        snapshot: qbittorrent
        detail: /media/downloads
        stale_after_minutes: 10
        setup_note: "Set QBIT_URL/QBIT_USER/QBIT_PASS in deploy/.env."
      - id: requests
        label: Requests
        tier: embed
        owner: shared
        snapshot: jellyseerr
        detail: /media/requests
        stale_after_minutes: 180
        setup_note: "Set JELLYSEERR_URL/JELLYSEERR_API_KEY in deploy/.env."
      # 2026-10-05: Discover & Search (search + shelves + Request) - live Jellyseerr call path.
      - id: discover
        label: Discover
        tier: embed
        owner: shared
        snapshot: jellyseerr
        detail: /media/discover
        stale_after_minutes: 180
        setup_note: "Set JELLYSEERR_URL/JELLYSEERR_API_KEY in deploy/.env."
      - id: history
        label: Watched
        tier: embed
        owner: shared                                # was you; her Jellyfin user has history/diary too (2026-10-05)
        snapshot: jellyfin
        detail: /media/history
        stale_after_minutes: 10
        setup_note: "Set JELLYFIN_URL/JELLYFIN_API_KEY in deploy/.env."
      - id: diary
        label: Diary
        tier: embed
        owner: shared                                # was you; her Jellyfin user has history/diary too (2026-10-05)
        snapshot: jellyfin
        detail: /media/diary                         # watch diary: Jellyfin history + hand-logged watches (2026-10-05)
        stale_after_minutes: 10
        setup_note: "Set JELLYFIN_URL/JELLYFIN_API_KEY in deploy/.env."
      - id: years
        label: By year
        tier: embed
        owner: you
        snapshot: jellyfin
        detail: /media/years                         # year rankings built from ratings (2026-10-05)
        stale_after_minutes: 10
        setup_note: "Set JELLYFIN_URL/JELLYFIN_API_KEY in deploy/.env."
      - id: jellyfin-app
        label: Open Jellyfin
        tier: link
        owner: shared
        href: "http://192.168.68.59:8096"            # Jellyfin on the NAS, LAN-only (WP6 adopt-in-place, 2026-09-11)

  - id: house
    hidden: true                                     # (parked by B., 2026-10-06 — not connected yet)
    name: House
    accent: "#FFB454"
    icon: house
    summary_tile: climate
    tiles:
      - id: climate
        label: Inside
        tier: embed
        owner: shared
        snapshot: home_assistant
        stale_after_minutes: 120
        setup_note: "Home Assistant connector arrives at WP28."

  - id: car
    hidden: true                                     # (parked by B., 2026-10-06 — not connected yet)
    name: Car
    accent: "#F87171"
    icon: car
    summary_tile: car-status
    tiles:
      - id: car-status
        label: Car
        tier: embed
        owner: you
        snapshot: home_assistant
        stale_after_minutes: 240
        setup_note: "Renders 'Not connected' until HA has car entities (Q16 — never fabricated)."
