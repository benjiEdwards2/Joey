# Joey stack. Host is the Asustor AS5304T NAS at 192.168.68.59 (DECISIONS
# 2026-08-31 D10 remap): repo /volume1/Docker/joey/life-dashboard, runtime
# data /volume1/Docker/joey/data. First engine-verify happened at the NAS
# bring-up (2026-08-31), superseding the WP24-step-1 note.
#
# Build context is the repo root for BOTH images (each Dockerfile COPYs config/
# and tests/, which live above their own directory).

services:
  hub:
    # The FastAPI hub (WP17-WP21). Reads snapshots READ-ONLY — tiles never
    # call a live API (the /money page's SQLite read is the one exception, D14;
    # the /img poster proxy is the second live-call exception, dated 2026-10-05 —
    # it reads the media keys from .env and caches art in the read-write img volume).
    image: life-hub
    build:
      context: ..
      dockerfile: hub/Dockerfile
    container_name: joey-hub
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SNAPSHOT_DIR: /data/snapshots
      IMG_CACHE_DIR: /data/cache/img
    volumes:
      - /volume1/Docker/joey/data/snapshots:/data/snapshots:ro
      - /volume1/Docker/joey/data/cache/img:/data/cache/img
    # NO public ports. The hub is reached only through the Cloudflare tunnel
    # container, which WP11 fronts it with on the compose network.
    expose:
      - "8000"

  cloudflared:
    # WP11 — remotely-managed Cloudflare tunnel (`joey-nas` in Zero Trust).
    # Fronts the hub over the compose network as http://hub:8000; the token
    # lives ONLY in the NAS-side .env (rule 11). No public hostnames until
    # WP12 puts Access in front.
    image: cloudflare/cloudflared:latest
    container_name: joey-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}

  connectors:
    # Hourly full sweep plus a 2-minute fast loop for the live Media feeds
    # (D16 amended 2026-10-05). sleep loops, NOT crond (D16) — phase drift
    # after a restart is accepted. Writes the snapshot envelopes the hub reads.
    image: life-connectors
    build:
      context: ..
      dockerfile: connectors/Dockerfile
    container_name: joey-connectors
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SNAPSHOT_DIR: /data/snapshots
      CONNECTOR_MODE: live
    volumes:
      - /volume1/Docker/joey/data/snapshots:/data/snapshots
    entrypoint: ["sh", "-c", "(while true; do python -m connectors.run_all --only jellyfin,media_status; sleep 120; done) & while true; do python -m connectors.run_all; sleep 3600; done"]
