# MacroMates static server (2026-10-05). SPA fallback so client-side routes
# reload cleanly; sw.js and index.html never cached so the installed PWA picks
# up new bundle versions on reload (the hashed assets/ chunks cache normally).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
