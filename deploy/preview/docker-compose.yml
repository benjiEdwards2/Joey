# JY-012 preview slot: ONE hub, compose project `joey-preview`, built from the previewed commit. Started and stopped only by
# `python scripts/joey.py preview up|down` (scripts/joey_preview.py), which copies THIS file to
# /volume1/Docker/joey/preview/docker-compose.yml (the previewed branch may predate deploy/preview/). Runbook: README.md here.
#
# Its own project name keeps it out of the main stack's `up -d --remove-orphans` (project `deploy`, from deploy.sh's
# directory): compose only removes orphans carrying its own project label. tests/deploy/test_preview_compose.py checks it.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

name: joey-preview

services:
  # The service name is also a DNS alias on the shared network: it must never equal a main-stack service name
  # (`hub` here would make cloudflared's hub:8000 resolve to the preview too).
  joey-preview:
    image: life-hub-preview
    pull_policy: never   # built on the NAS by preview up (docker build -t life-hub-preview)
    container_name: joey-preview
    # "no": the NAS powers off 22:00-07:00; the slot does not come back by itself and eat RAM the next morning.
    restart: "no"
    logging: *logging
    mem_limit: 256m
    # Allow-listed keys only (scripts/joey_preview.py ENV_IN), built on the NAS from the live .env; chmod 600, never in git.
    env_file:
      - preview.env
    # environment wins over env_file: every background loop stays off whatever preview.env says. The server alerts loop
    # has no switch: with no Discord webhook it posts nothing and its samples land in the media.db COPY.
    environment:
      SNAPSHOT_DIR: /data/snapshots
      IMG_CACHE_DIR: /data/cache/img
      MEDIA_DB_PATH: /data/sqlite/media.db
      MEDIA_BACKUP_DIR: /data/no-backups
      MEDIA_BACKUP: "off"
      PLAY_RECORDER: "off"
      MEDIA_WARMUP: "off"
      MEDIA_FOLLOW: "off"
      MEDIA_AWARDS: "off"
      DIGEST: "off"
    labels:
      joey.preview.commit: ${PREVIEW_COMMIT:-unknown}
    volumes:
      # live snapshots, read only
      - /volume1/Docker/joey/data/snapshots:/data/snapshots:ro
      # the media.db COPY (newest daily backup, restored by preview up); the live sqlite dir is never mounted
      - /volume1/Docker/joey/preview/sqlite:/data/sqlite
      # preview-only poster and meta cache
      - /volume1/Docker/joey/preview/cache:/data/cache
    # NO ports. The tunnel reaches it as http://joey-preview:8000 on the main stack's default network.
    expose:
      - "8000"
    networks:
      - joey

networks:
  joey:
    external: true
    name: deploy_default
