; Joey TV WP-A5 (2026-10-19): swag runs in host network mode, where php-fpm's stock pool (listen = 127.0.0.1:9000,
; /etc/php85/php-fpm.d/www.conf) clashes with Portainer's published host port 9000 ("Address in use (98)").
; The base image includes /config/php/*.conf after php-fpm.d/*.conf, and php-fpm merges this [www] section into the
; stock pool, so only `listen` changes. A unix socket takes no port. Nothing of ours uses PHP (no fastcgi_pass).
; Bind-mounted read-only from deploy/swag/php/www2.conf (tests/deploy/test_edge.py).

[www]
listen = /var/run/php-fpm.sock
