## Joey TV WP-A3 (2026-10-18) — adapted from SWAG 5.8.0-ls490's jellyfin.subdomain.conf.sample (Version 2025/07/18).
## Bind-mounted read-only by deploy/docker-compose.yml; a change is live after deploy.sh's `nginx -s reload`.
## Changes from the sample: one exact server_name (E2); IPv6 and QUIC listeners dropped (E4); AU-only geo gate (E6,
## variables from site-confs/00-geo-au.conf); HSTS; /metrics closed instead of proxied.
## Upstream: jellyfin:8096 BY NAME over the joey-edge network (rule 14) — the only proxy target nginx has.
## Jellyfin Known proxies = the joey-edge subnet (Q45), so the X-Forwarded-For set by proxy.conf is trusted.

server {
    listen 443 ssl;

    server_name jellyfin.joeyhome.net;

    include /config/nginx/ssl.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # E6: AU or a private range only (map in site-confs/00-geo-au.conf); everyone else gets 403
    if ($geo_allowed = 0) {
        return 403;
    }

    client_max_body_size 0;

    location / {
        # proxy.conf carries the websocket Upgrade/Connection headers and X-Forwarded-*
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app jellyfin;
        set $upstream_port 8096;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }

    location ~ (/jellyfin)?/socket {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app jellyfin;
        set $upstream_port 8096;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    # Prometheus metrics are never served through the public edge
    location /metrics {
        return 404;
    }
}
