## Joey TV WP-A3 (2026-10-18) — adapted from SWAG 5.8.0-ls490's jellyfin.subdomain.conf.sample (Version 2025/07/18).
## Bind-mounted read-only (single file) by deploy/docker-compose.yml; a change is live after deploy.sh recreates swag.
## Changes from the sample: one exact server_name (E2); IPv6 and QUIC listeners dropped (E4); AU + NZ geo gate (E6,
## variables from site-confs/00-geo-au.conf); one HSTS header; /metrics closed instead of proxied.
## Upstream (WP-A4, Q44 = a host network mode): http://127.0.0.1:8096, Jellyfin's published port on loopback, the
## rule-14 exception — the only proxy target nginx has. A literal, so no resolver is needed. docker-proxy carries it
## into the jellyfin container from the joey-edge gateway, so Jellyfin Known proxies = 172.31.250.1, 172.18.0.1
## (docs/public-edge.md) and the X-Forwarded-For set by proxy.conf is trusted.

server {
    listen 443 ssl;

    server_name jellyfin.joeyhome.net;

    include /config/nginx/ssl.conf;

    # HSTS: exactly one header, SWAG's own from ssl.conf (max-age=63072000). A second add_header here doubled it
    # (G3, 2026-10-19); proxy_hide_header keeps any upstream one out (inherited: no location sets its own).
    proxy_hide_header Strict-Transport-Security;

    # E6: AU, NZ or a private range only (map in site-confs/00-geo-au.conf); everyone else gets 403
    if ($geo_allowed = 0) {
        return 403;
    }

    client_max_body_size 0;

    location / {
        # proxy.conf carries the websocket Upgrade/Connection headers and X-Forwarded-*
        include /config/nginx/proxy.conf;
        proxy_pass http://127.0.0.1:8096;

        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }

    location ~ (/jellyfin)?/socket {
        include /config/nginx/proxy.conf;
        proxy_pass http://127.0.0.1:8096;
    }

    # Prometheus metrics are never served through the public edge
    location /metrics {
        return 404;
    }
}
