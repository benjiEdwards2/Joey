## Joey TV WP-A3 (2026-10-18) — E6 geo gate, http context (SWAG includes /config/nginx/site-confs/*.conf inside
## http{}; "00-" sorts it before default.conf). Bind-mounted read-only.
## Allow-list: AU + NZ (B., 2026-10-18). The file name "00-geo-au" is historical: kept so the compose binds and tests do not change.
## Our OWN variable names ($joey_country, $joey_private, $joey_country_allowed, $geo_allowed): the swag-dbip mod
## declares its own geoip2 block on the same database, and a shared variable name would collide (nginx -t checks it
## live in WP-A4). The database is downloaded and refreshed by DOCKER_MODS=linuxserver/mods:swag-dbip.
## $remote_addr is the real client IP: swag runs in host network mode (WP-A4, Q44 = a), so nginx accepts the TCP
## connection itself with no docker-proxy in between; re-verified from the internet at WP-A5 G4/G5.

geoip2 /config/geoip2db/dbip-country-lite.mmdb {
    $joey_country country iso_code;
}

map $joey_country $joey_country_allowed {
    default 0;
    AU 1;
    NZ 1;
}

# Private ranges, mode (a) host: the LAN, plus loopback. No external client can arrive as a Docker bridge address in
# host mode, so 172.16/12 is NOT private. 127.0.0.1 can only be a local process: deploy.sh's smoke curl
# (--resolve jellyfin.joeyhome.net:443:127.0.0.1 from a host-network container), which a 403 would roll back.
# CGNAT is NOT private here.
geo $remote_addr $joey_private {
    default 0;
    192.168.0.0/16 1;
    10.0.0.0/8 1;
    127.0.0.1/32 1;
}

# allowed = private OR AU/NZ ("<private><country>")
map "$joey_private$joey_country_allowed" $geo_allowed {
    default 0;
    "01" 1;
    "10" 1;
    "11" 1;
}
