## Joey TV WP-A3 (2026-10-18) — adapted from SWAG 5.8.0-ls490's site-confs/default.conf.sample (Version 2026/03/07).
## Bind-mounted read-only. Changes from the sample: no port-80 redirect server and no port 80 at all (E1); no IPv6
## or QUIC listeners (E4); the catch-all serves nothing — every Host, SNI or bare IP that is not
## jellyfin.joeyhome.net closes with 444 (E2); no www root, PHP or subfolder proxy confs.
## Host network mode (WP-A4): any `listen 80` would bind the NAS's own port 80. This bind mount replaces the sample
## default; the image's other nginx confs (nginx.conf, Alpine's http.d/default.conf, removed in the base image) have none.

# catch-all server block
server {
    listen 443 ssl default_server;

    server_name _;

    include /config/nginx/ssl.conf;

    return 444;
}

# enable subdomain method reverse proxy confs (the one: proxy-confs/jellyfin.subdomain.conf)
include /config/nginx/proxy-confs/*.subdomain.conf;
