<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life Dashboard — Control Surface mockup (WP0 gate)</title>
<style>
  /* ---- Palette per DECISIONS 2026-08-17/25 — dark Control Surface ---- */
  :root {
    --bg: #08090D;
    --card: #101219;
    --border: #1D212B;
    --text: #E8EAF0;
    --text-dim: #8A90A0;
    --text-faint: #565C6B;
    --stale: #FFB454;
    --kitchen: #5BE08C; --money: #3FD9C0; --desk: #5B9CF6; --calendar: #A78BFA;
    --media: #FF5CA8; --house: #FFB454; --car: #F87171; --garden: #22D3EE;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); }
  body {
    font-family: system-ui, "Segoe UI", Roboto, sans-serif;
    font-variant-numeric: tabular-nums;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ---- Layout: header, tab bar, page area ---- */
  header {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
    padding: 20px 24px 8px;
    max-width: 1180px; margin: 0 auto;
  }
  header h1 { font-size: 20px; font-weight: 650; letter-spacing: .2px; }
  header .date { color: var(--text-dim); font-size: 13px; }

  /* Owner switcher — segmented Both / You / Her */
  .switcher {
    display: inline-flex; border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; background: var(--card);
  }
  .switcher button {
    appearance: none; border: 0; background: transparent; color: var(--text-dim);
    font: inherit; font-size: 13px; padding: 7px 16px; cursor: pointer;
  }
  .switcher button[aria-pressed="true"] { background: var(--border); color: var(--text); font-weight: 600; }

  /* Tab bar — the room registry rendered. Desktop: horizontal under the header. */
  nav.tabs {
    display: flex; gap: 4px; flex-wrap: nowrap;
    padding: 8px 24px 14px;
    max-width: 1180px; margin: 0 auto;
  }
  nav.tabs button {
    appearance: none; font: inherit; cursor: pointer;
    display: flex; align-items: center; gap: 7px;
    background: var(--card); color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 12px;
    padding: 9px 14px; font-size: 13px; white-space: nowrap;
  }
  nav.tabs button .em { font-size: 15px; }
  nav.tabs button[aria-current="true"] {
    color: var(--text); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent);
  }
  nav.tabs button.more-btn { display: none; }

  main { max-width: 1180px; margin: 0 auto; padding: 4px 24px 90px; }
  .page { display: none; }
  .page.active { display: block; }
  .page h2 { font-size: 16px; font-weight: 650; margin: 10px 0 14px; display: flex; align-items: center; gap: 8px; }
  .page h2 .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); display: inline-block; }
  .page .pagenote { color: var(--text-faint); font-size: 12px; margin: -8px 0 14px; }

  /* Card grid — wraps by available width; multi-column at 1280, 1–2 cols at 375 */
  .grid {
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  }

  /* ---- Tile anatomy ---- */
  .tile {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    display: flex; flex-direction: column; gap: 8px;
    min-height: 128px;
    position: relative;
  }
  .tile .head { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-dim); }
  .tile .head .em { font-size: 16px; }
  .tile .head .area-name { color: var(--accent); font-weight: 600; letter-spacing: .3px; }
  .tile .value { font-size: 24px; font-weight: 650; letter-spacing: .2px; line-height: 1.2; }
  .tile .value.dim { color: var(--text-dim); font-size: 16px; font-weight: 500; }
  .tile .sub { font-size: 13px; color: var(--text-dim); }
  .tile .foot { margin-top: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  /* Ownership chips — text, never colour-only, never the accent slot */
  .chip {
    font-size: 11px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase;
    color: var(--text-dim); background: var(--bg);
    border: 1px solid var(--border); border-radius: 999px; padding: 3px 9px;
  }

  /* State badges — coloured AND written in words */
  .badge { font-size: 11px; font-weight: 600; border-radius: 999px; padding: 3px 9px; letter-spacing: .3px; }
  .badge.fresh { color: var(--kitchen); border: 1px solid var(--kitchen); }
  .badge.stale { color: var(--stale); border: 1px solid var(--stale); }
  .badge.off   { color: var(--text-faint); border: 1px solid var(--border); }

  /* LINK-tier launch button */
  a.launch {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--accent); border-radius: 10px;
    padding: 9px 16px; font-size: 14px; font-weight: 600; text-decoration: none;
  }
  a.setup { color: var(--text-dim); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }

  /* Progress bar (aimed vs actual) — value also written in words beside it */
  .bar { height: 6px; background: var(--bg); border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); }

  /* Accent swatch table (gate checklist aid, on Desk of the mockup only) */
  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 10px; }
  .swatch { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-dim); }
  .swatch i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }

  /* States demo strip */
  .demo-label { font-size: 12px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .6px; margin: 22px 0 10px; }

  /* "More" sheet (phone) */
  .sheet {
    display: none; position: fixed; left: 0; right: 0; bottom: 64px;
    background: var(--card); border-top: 1px solid var(--border);
    padding: 10px 16px 14px; z-index: 30;
  }
  .sheet.open { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .sheet button {
    appearance: none; font: inherit; cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    background: var(--bg); color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 13px;
  }
  .sheet button[aria-current="true"] { color: var(--text); border-color: var(--accent); }

  /* ---- Phone: <=640px — bottom tab bar, 4 areas + More ---- */
  @media (max-width: 640px) {
    header { padding: 16px 16px 6px; }
    main { padding: 2px 16px 96px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    nav.tabs {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
      background: var(--card); border-top: 1px solid var(--border);
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      max-width: none; justify-content: space-between; gap: 2px;
    }
    nav.tabs button { border: 0; background: transparent; flex-direction: column; gap: 2px; padding: 4px 8px; font-size: 10px; }
    nav.tabs button .em { font-size: 20px; }
    nav.tabs button[aria-current="true"] { box-shadow: none; color: var(--accent); }
    nav.tabs button.overflow { display: none; }      /* areas 5–8 fold away */
    nav.tabs button.more-btn { display: flex; }       /* ...into More */
  }
</style>
</head>
<body>

<header>
  <div>
    <h1 id="greeting">Edwards House</h1>
    <div class="date">Tuesday 25 August · mockup — static data</div>
  </div>
  <div class="switcher" role="group" aria-label="Who's looking">
    <button data-view="both" aria-pressed="true">Both</button>
    <button data-view="you" aria-pressed="false">You</button>
    <button data-view="her" aria-pressed="false">Her</button>
  </div>
</header>

<nav class="tabs" id="tabbar" aria-label="Areas"></nav>
<div class="sheet" id="moreSheet"></div>

<main id="pages"></main>

<script>
/* =========================================================================
   The registry. In the real build this is config/areas.yaml (WP16) —
   the tab bar, hub grid, and pages below all render from this one array.
   ========================================================================= */
const AREAS = [
  { id:"hub",      name:"Hub",      emoji:"⌂",  accent:"#8A90A0" },
  { id:"kitchen",  name:"Kitchen",  emoji:"🍳", accent:"#5BE08C" },
  { id:"money",    name:"Money",    emoji:"💰", accent:"#3FD9C0" },
  { id:"desk",     name:"Desk",     emoji:"🖥️", accent:"#5B9CF6" },
  { id:"calendar", name:"Calendar", emoji:"📅", accent:"#A78BFA" },
  { id:"media",    name:"Media",    emoji:"🎬", accent:"#FF5CA8" },
  { id:"house",    name:"House",    emoji:"🏠", accent:"#FFB454" },
  { id:"car",      name:"Car",      emoji:"🚗", accent:"#F87171" },
  { id:"garden",   name:"Garden",   emoji:"🌱", accent:"#22D3EE" },
];
const area = id => AREAS.find(a => a.id === id);

/* Tile factory: state = fresh | stale | off (not connected) */
function tile({areaId, owner, value, valueDim, sub, state, stateText, secondary, body, minH}) {
  const a = area(areaId);
  const badge = state === "fresh" ? `<span class="badge fresh">fresh</span>`
              : state === "stale" ? `<span class="badge stale">stale ${stateText}</span>`
              : state === "off"   ? `<span class="badge off">not connected</span>` : "";
  return `<div class="tile" data-owner="${owner}" style="--accent:${a.accent}">
    <div class="head"><span class="em">${a.emoji}</span><span class="area-name">${a.name}</span></div>
    ${value ? `<div class="value${valueDim ? " dim" : ""}">${value}</div>` : ""}
    ${secondary ? `<div class="sub">${secondary}</div>` : ""}
    ${sub ? `<div class="sub">${sub}</div>` : ""}
    ${body || ""}
    <div class="foot"><span class="chip">${owner === "you" ? "You" : owner === "her" ? "Her" : "Shared"}</span>${badge}</div>
  </div>`;
}

/* ---- Hub: one summary tile per area (Money shows the one allowed secondary line, D17) ---- */
const hubTiles = [
  tile({areaId:"kitchen", owner:"shared", value:"Tacos tonight", sub:"MacroMates · 4 items on the list", state:"fresh"}),
  tile({areaId:"money", owner:"shared", value:"$1,240 left", secondary:"Next bill: Electricity — Fri 29th", sub:"of $6,800 aimed this month", state:"fresh"}),
  tile({areaId:"desk", owner:"you", value:"3 files this week", sub:"NAS drop folder", state:"fresh"}),
  tile({areaId:"calendar", owner:"her", value:"Physio 3:30 pm", sub:"today · 2 more this week", state:"fresh"}),
  tile({areaId:"media", owner:"shared", value:"2 new episodes", sub:"Jellyfin · continue watching", state:"fresh"}),
  tile({areaId:"house", owner:"shared", value:"21.5 °C inside", sub:"heating off · last read 9:04 am", state:"stale", stateText:"5 h"}),
  tile({areaId:"car", owner:"you", value:"Not connected", valueDim:true, body:`<a class="setup" href="#" onclick="return false">Set up →</a>`, state:"off"}),
  tile({areaId:"garden", owner:"shared", value:"Not connected", valueDim:true, body:`<a class="setup" href="#" onclick="return false">Set up →</a>`, state:"off"}),
];

/* ---- Money area page: aimed-vs-actual leads (DECISIONS 2026-08-25) ---- */
function barTile(areaId, owner, label, actual, aimed, pct) {
  return tile({areaId, owner, value: label, valueDim:true,
    body: `<div class="value">$${actual} <span style="font-size:14px;color:var(--text-dim);font-weight:500">of $${aimed} aimed</span></div>
           <div class="bar"><span style="width:${pct}%"></span></div>
           <div class="sub">${pct}% of aim used — in words, not just the bar</div>`,
    state:"fresh"});
}
const moneyTiles = [
  barTile("money","shared","This month — all categories", "5,560", "6,800", 82),
  barTile("money","shared","Groceries", "684", "900", 76),
  barTile("money","you","Fuel — you", "112", "160", 70),
  tile({areaId:"money", owner:"shared", value:"Electricity — Fri 29th", sub:"then: Internet 1st · Mortgage 1st", state:"fresh"}),
];

/* Three tile states side by side (gate item c) */
const statesDemo = `
  <div class="demo-label">Tile states — the three the hub can render</div>
  <div class="grid">
    ${tile({areaId:"money", owner:"shared", value:"$1,240 left", sub:"updated 12 min ago", state:"fresh"})}
    ${tile({areaId:"money", owner:"shared", value:"$1,240 left", sub:"showing last known value", state:"stale", stateText:"5 h"})}
    ${tile({areaId:"money", owner:"shared", value:"Not connected", valueDim:true, body:`<a class="setup" href="#" onclick="return false">Set up →</a>`, state:"off"})}
  </div>`;

/* ---- Calendar page: weather is an EMBED tile HERE, not a hub pill (D18) ---- */
const calendarTiles = [
  tile({areaId:"calendar", owner:"shared", value:"18 °C · light rain", sub:"Open-Meteo · today 14–19 °C · EMBED tier", state:"fresh"}),
  tile({areaId:"calendar", owner:"her", value:"Physio 3:30 pm", sub:"today", state:"fresh"}),
  tile({areaId:"calendar", owner:"you", value:"Site visit 9:00 am", sub:"tomorrow", state:"fresh"}),
  tile({areaId:"calendar", owner:"shared", value:"Dinner @ Mum's", sub:"Saturday 6:00 pm", state:"fresh"}),
];

/* ---- Desk page: the Notion LINK tile (gate item d) + accent swatch table ---- */
const deskTiles = [
  tile({areaId:"desk", owner:"shared", value:"Notes", valueDim:true,
    body:`<a class="launch" href="#" onclick="return false">Open Notion ↗</a>
          <div class="sub" style="margin-top:6px">LINK tier — opens the real app, nothing ingested</div>`, state:"fresh"}),
  tile({areaId:"desk", owner:"you", value:"3 files this week", sub:"NAS drop folder", state:"fresh"}),
];
const swatchTable = `
  <div class="demo-label">Proposed accent hues (gate item — approve or adjust)</div>
  <div class="tile" data-owner="shared" style="--accent:#5B9CF6">
    <div class="swatches">
      ${AREAS.filter(a=>a.id!=="hub").map(a=>`<span class="swatch"><i style="background:${a.accent}"></i>${a.emoji} ${a.name} <code>${a.accent}</code></span>`).join("")}
    </div>
    <div class="foot"><span class="chip">Shared</span></div>
  </div>`;

/* ---- Stub pages for the remaining areas ---- */
const stub = id => `<div class="grid">${tile({areaId:id, owner:"shared", value:"Not connected", valueDim:true,
  body:`<a class="setup" href="#" onclick="return false">Set up →</a>`, state:"off"})}</div>
  <p class="pagenote" style="margin-top:12px">Area page arrives with its connector — the tab exists from day one because rooms are config, not code.</p>`;

const PAGES = {
  hub: `<div class="grid">${hubTiles.join("")}</div>`,
  money: `<div class="grid">${moneyTiles.join("")}</div>${statesDemo}`,
  calendar: `<div class="grid">${calendarTiles.join("")}</div>`,
  desk: `<div class="grid">${deskTiles.join("")}</div>${swatchTable}`,
  kitchen: stub("kitchen"), media: stub("media"), house: stub("house"), car: stub("car"), garden: stub("garden"),
};

/* ---- Render tab bar + pages from the registry ---- */
const tabbar = document.getElementById("tabbar");
const sheet = document.getElementById("moreSheet");
const pagesEl = document.getElementById("pages");

AREAS.forEach((a, i) => {
  const b = document.createElement("button");
  b.innerHTML = `<span class="em">${a.emoji}</span><span>${a.name}</span>`;
  b.style.setProperty("--accent", a.accent);
  b.dataset.page = a.id;
  if (i >= 4) b.classList.add("overflow");            /* phone: areas 5+ fold into More */
  b.addEventListener("click", () => show(a.id));
  tabbar.appendChild(b);

  const s = document.createElement("button");
  s.innerHTML = `<span class="em">${a.emoji}</span><span>${a.name}</span>`;
  s.style.setProperty("--accent", a.accent);
  s.dataset.page = a.id;
  s.addEventListener("click", () => { show(a.id); sheet.classList.remove("open"); });
  sheet.appendChild(s);

  const pg = document.createElement("section");
  pg.className = "page"; pg.id = "page-" + a.id;
  pg.style.setProperty("--accent", a.accent);
  pg.innerHTML = (a.id === "hub" ? "" : `<h2><span class="dot"></span>${a.name}</h2>`) + PAGES[a.id];
  pagesEl.appendChild(pg);
});

const more = document.createElement("button");
more.className = "more-btn";
more.innerHTML = `<span class="em">⋯</span><span>More</span>`;
more.addEventListener("click", () => sheet.classList.toggle("open"));
tabbar.appendChild(more);

function show(id) {
  document.querySelectorAll(".page").forEach(p => p.classList.toggle("active", p.id === "page-" + id));
  document.querySelectorAll("[data-page]").forEach(b => b.setAttribute("aria-current", b.dataset.page === id ? "true" : "false"));
}
show("hub");

/* ---- Owner switcher: You = you+shared, Her = her+shared, Both = all (Q9) ---- */
document.querySelectorAll(".switcher button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".switcher button").forEach(b => b.setAttribute("aria-pressed", b === btn ? "true" : "false"));
    const v = btn.dataset.view;
    document.querySelectorAll("[data-owner]").forEach(t => {
      const o = t.dataset.owner;
      t.style.display = (v === "both" || o === "shared" || o === v) ? "" : "none";
    });
  });
});
</script>
</body>
</html>
