<!DOCTYPE html>
<!-- Screenshot shim: renders mockup.html in a true 375px viewport via iframe.
     Headless Chromium enforces a ~492px minimum window width, so a direct
     --window-size=375 render is a cropped 492px layout. Not part of the mockup. -->
<html><body style="margin:0;background:#08090D">
<iframe src="mockup.html" style="width:375px;height:812px;border:0;display:block"></iframe>
</body></html>
