{# Embedded SVG line icons (gate decision 2026-08-28 — no emoji, zero network).
   icon ids match areas.yaml `icon:` values; "hub" and "more" are chrome. #}
{% macro icon(id) -%}
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
{%- if id == "hub" -%}
<rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>
{%- elif id == "kitchen" -%}
<circle cx="10.5" cy="13.5" r="6"/><path d="M16.5 13.5h5M13 4.5c-1 1-1 2 0 3M9.5 4.5c-1 1-1 2 0 3"/>
{%- elif id == "money" -%}
<path d="M12 5.5v13M15.5 8c0-1.2-1.5-2-3.5-2s-3.5.8-3.5 2 1.3 1.9 3.5 2.2 3.5 1 3.5 2.3-1.5 2-3.5 2-3.5-.8-3.5-2"/>
{%- elif id == "desk" -%}
<rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M9 20h6M12 16.5V20"/>
{%- elif id == "calendar" -%}
<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8.5 3v4M15.5 3v4"/>
{%- elif id == "media" -%}
<circle cx="12" cy="12" r="8.5"/><path d="M10 8.8l5.4 3.2-5.4 3.2z"/>
{%- elif id == "house" -%}
<path d="M3.5 11L12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/>
{%- elif id == "car" -%}
<path d="M4.5 14.5l1.4-4.2A2 2 0 0 1 7.8 9h8.4a2 2 0 0 1 1.9 1.3l1.4 4.2"/><rect x="3.5" y="14.5" width="17" height="4" rx="1"/><circle cx="7.5" cy="19.5" r="1.4"/><circle cx="16.5" cy="19.5" r="1.4"/>
{%- elif id == "garden" -%}
<path d="M12 21v-8.5"/><path d="M12 12.5c0-4.2 3.1-7 7-7 0 4.2-3.1 7-7 7z"/><path d="M12 12.5c0-3.2-2.4-5-5.5-5 0 3.2 2.4 5 5.5 5z"/>
{%- elif id == "server" -%}
<rect x="3.5" y="4" width="17" height="7" rx="1.5"/><rect x="3.5" y="13" width="17" height="7" rx="1.5"/><path d="M7 7.5h.1M7 16.5h.1M11 7.5h6M11 16.5h6"/>
{%- elif id == "more" -%}
<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>
{#- wx-* glyphs: hub weather glimpse + /weather (2026-09-11). Condition word always renders beside them — never colour/icon-only. -#}
{%- elif id == "wx-sun" -%}
<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/>
{%- elif id == "wx-cloud" -%}
<path d="M7 17.5h9.5a3.5 3.5 0 0 0 .6-6.95A5.5 5.5 0 0 0 6.3 9.6 4 4 0 0 0 7 17.5z"/>
{%- elif id == "wx-fog" -%}
<path d="M7 14.5h9.5a3.5 3.5 0 0 0 .6-6.95A5.5 5.5 0 0 0 6.3 6.6 4 4 0 0 0 7 14.5z"/><path d="M5.5 18h13M7.5 21h9"/>
{%- elif id == "wx-rain" -%}
<path d="M7 14.5h9.5a3.5 3.5 0 0 0 .6-6.95A5.5 5.5 0 0 0 6.3 6.6 4 4 0 0 0 7 14.5z"/><path d="M8.5 17.5l-1 3M12.5 17.5l-1 3M16.5 17.5l-1 3"/>
{%- elif id == "wx-snow" -%}
<path d="M7 14.5h9.5a3.5 3.5 0 0 0 .6-6.95A5.5 5.5 0 0 0 6.3 6.6 4 4 0 0 0 7 14.5z"/><circle cx="8.5" cy="18.5" r=".9"/><circle cx="12.5" cy="21" r=".9"/><circle cx="16.5" cy="18.5" r=".9"/>
{%- elif id == "wx-thunder" -%}
<path d="M7 14.5h9.5a3.5 3.5 0 0 0 .6-6.95A5.5 5.5 0 0 0 6.3 6.6 4 4 0 0 0 7 14.5z"/><path d="M12.5 15.5l-2.3 3.7h3.2L11.5 23"/>
{#- file-quality glyphs (2026-10-06): generic shapes only — the word beside them carries the meaning. -#}
{%- elif id == "res" -%}
<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 10v4M7 12h3M10 10v4M13.5 14v-4h2a1.5 1.5 0 0 1 0 3h-2"/>
{%- elif id == "hdr" -%}
<circle cx="12" cy="12" r="4"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/>
{%- elif id == "codec" -%}
<path d="M8.5 7L4 12l4.5 5M15.5 7L20 12l-4.5 5M13.5 5l-3 14"/>
{%- elif id == "box" -%}
<path d="M12 3.5l8 4v9l-8 4-8-4v-9z"/><path d="M4 7.5l8 4 8-4M12 11.5v9"/>
{%- elif id == "audio" -%}
<path d="M4 9.5v5h3.5l5 4v-13l-5 4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/>
{%- elif id == "channels" -%}
<circle cx="12" cy="12" r="2"/><circle cx="5" cy="6" r="1.5"/><circle cx="19" cy="6" r="1.5"/><circle cx="5" cy="18" r="1.5"/><circle cx="19" cy="18" r="1.5"/>
{%- elif id == "atmos" -%}
<path d="M3.5 17.5a8.5 8.5 0 0 1 17 0"/><path d="M7.5 17.5a4.5 4.5 0 0 1 9 0"/><circle cx="12" cy="17.5" r=".9"/>
{%- elif id == "disk" -%}
<ellipse cx="12" cy="6.5" rx="7.5" ry="3"/><path d="M4.5 6.5v11c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-11M4.5 12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3"/>
{%- else -%}
<circle cx="12" cy="12" r="8.5"/><path d="M9.5 9.5c0-1.4 1.1-2.5 2.5-2.5s2.5 1 2.5 2.4c0 2-2.5 2.1-2.5 4.1M12 17.5v.1"/>
{%- endif -%}
</svg>
{%- endmacro %}
