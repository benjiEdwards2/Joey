{# Embedded SVG line icons (gate decision 2026-08-28 — no emoji, zero network).

{% macro icon(id) -%}
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">

<rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>

<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8.5 3v4M15.5 3v4"/>

<circle cx="12" cy="12" r="8.5"/><path d="M10 8.8l5.4 3.2-5.4 3.2z"/>

<path d="M3.5 11L12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/>

<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>
{#- wx-* glyphs: hub weather glimpse + /weather (2026-09-11). Condition word always renders beside them — never colour/icon-only. -#}
{%- elif id == "wx-sun" -%}
<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/>

{%- elif id == "res" -%}
<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 10v4M7 12h3M10 10v4M13.5 14v-4h2a1.5 1.5 0 0 1 0 3h-2"/>
{%- elif id == "hdr" -%}
<circle cx="12" cy="12" r="4"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/>
{%- elif id == "codec" -%}
<path d="M8.5 7L4 12l4.5 5M15.5 7L20 12l-4.5 5M13.5 5l-3 14"/>
{%- elif id == "box" -%}
<path d="M12 3.5l8 4v9l-8 4-8-4v-9z"/><path d="M4 7.5l8 4 8-4M12 11.5v9"/>

{#- Media (restyle Phase 3, 2026-10-06): lucide-style controls; every icon-only button carries an aria-label. -#}
{%- elif id == "search" -%}

{%- elif id == "bookmark" -%}
<path d="M18.5 20.5L12 16.8l-6.5 3.7V5.5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2z"/>

<rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M7.5 3.5v17M16.5 3.5v17M3.5 8h4M3.5 12h17M3.5 16h4M16.5 8h4M16.5 16h4"/>

<path d="M17.5 6.5l-11 11M6.5 6.5l11 11"/>
{%- elif id == "plus" -%}
<path d="M5 12h14M12 5v14"/>
{#- Media phone bar (2026-10-07): TV, Diary, Discover slots. -#}
{%- elif id == "tv" -%}
<rect x="3" y="6" width="18" height="12.5" rx="2"/><path d="M8.5 2.5L12 6l3.5-3.5M8 21.5h8"/>
{%- elif id == "diary" -%}
<path d="M5.5 4.5A1.5 1.5 0 0 1 7 3h11.5v15H7a1.5 1.5 0 0 0-1.5 1.5z"/><path d="M5.5 19.5A1.5 1.5 0 0 0 7 21h11.5v-3M9.5 7.5h5M9.5 11h5"/>

<circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.2l2.4 2.4 4.6-4.8"/>

<circle cx="12" cy="12" r="8.5"/><path d="M9.5 9.5c0-1.4 1.1-2.5 2.5-2.5s2.5 1 2.5 2.4c0 2-2.5 2.1-2.5 4.1M12 17.5v.1"/>

</svg>
