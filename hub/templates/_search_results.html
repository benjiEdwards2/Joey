{# Title-search results for the Log a watch form (2026-10-05); each pick is one JSON blob
   the /media/log route re-validates. #}
{% from "_poster.html" import poster %}
{% if note %}<div class="sub appnote">{{ note }}</div>{% endif %}
{% for r in rows %}
<label class="uprow hasposter pickrow">
  <input type="radio" name="pick" value='{{ r|tojson }}' required>
  {{ poster(r.poster, r.title, 120, "sm") }}
  <span class="uptitle">{{ r.title }}{% if r.year %} ({{ r.year }}){% endif %}</span>
  <span class="chip">{{ "Film" if r.kind == "movie" else "TV" }}</span>
</label>
{% endfor %}
