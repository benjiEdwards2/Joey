{% extends "base.html" %}
{% block title %}{{ area.name }} · Joey{% endblock %}
{% block content %}
<h2 style="--accent: {{ area.accent }}"><span class="dot"></span>{{ area.name }}</h2>
<div class="grid">
  {% for row in tiles %}
    {% with tile = row.tile, st = row.st, accent = area.accent, heading = row.tile.label %}
      {% include "_tile.html" %}
    {% endwith %}
  {% endfor %}
</div>
{% endblock %}
