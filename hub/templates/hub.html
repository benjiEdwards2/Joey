{% extends "base.html" %}
{% block title %}Jarvis{% endblock %}
{% block content %}
<div class="grid">
  {% for c in cards %}
  <a class="cardlink" href="/a/{{ c.area.id }}">
    {% with tile = c.tile, st = c.st, accent = c.area.accent, heading = c.area.name %}
      {% include "_tile.html" %}
    {% endwith %}
  </a>
  {% endfor %}
</div>
{% endblock %}
